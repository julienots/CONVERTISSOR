name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature (secrets GitHub, optionnel)
        env:
          SE_KEYSTORE_BASE64: ${{ secrets.SE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SE_KEYSTORE_BASE64" ]; then
            echo "$SE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Aucun secret SE_KEYSTORE_BASE64 : signature avec la clé de debug."
          fi

      - name: Compiler l'APK
        env:
          SE_KEYSTORE_PASSWORD: ${{ secrets.SE_KEYSTORE_PASSWORD }}
          SE_KEY_ALIAS: ${{ secrets.SE_KEY_ALIAS }}
          SE_KEY_PASSWORD: ${{ secrets.SE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/Fluxo.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Fluxo-apk
          path: out/Fluxo.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fluxo v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/Fluxo.apk
          body: |
            📲 Télécharge **Fluxo.apk** ci-dessous et installe-le sur ton téléphone Android (8.0 ou plus).
            Créé par SuperEssence Studio.
